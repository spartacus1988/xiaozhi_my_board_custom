repository: git://github.com/espressif/esp-iot-solution.git
repository_info:
  commit_sha: a2dd58acf2fef837c9d5e2e86b7e33d318b6b2ff
  path: components/usb/iot_usbh_cdc
targets:
- esp32s2
- esp32s3
- esp32s31
- esp32p4
url: https://github.com/espressif/esp-iot-solution/tree/master/components/usb/iot_usbh_cdc
version: 3.1.0
